apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: cloudflare-domain
  description: Adopts the freeploy.io Cloudflare zone and attaches the Freeploy console (deploy-web) and API (api-edge) custom domains to each environment's Workers
  labels:
    domain: infra
    scope: dns-and-custom-domains

spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: terraform
  lifecycle: production
  owner: platform
  domain: infra

  parameters:
    orgName: sourceplane
    stackName: cloudflare-domain
    terraformDir: terraform
    terraformVersion: "1.15.3"
    baseDomain: freeploy.io
    zoneMode: existing
    workerNamePrefix: freeploy-deploy-web
    apiWorkerNamePrefix: freeploy-api-edge
    # `API_CUSTOM_DOMAIN` is likewise NOT declared here, for the same reason
    # as CONSOLE_CUSTOM_DOMAIN below: it is per-environment in `intent.yaml`
    # (dev: "", stage: api-stage.freeploy.io, prod: api.freeploy.io).
    # NOTE: `CONSOLE_CUSTOM_DOMAIN` is intentionally NOT declared here.
    # It is supplied per-environment via
    # `environments.{dev,stage,prod}.parameterDefaults.terraform.CONSOLE_CUSTOM_DOMAIN`
    # in `intent.yaml` (dev: "", stage: stage.freeploy.io,
    # prod: app.freeploy.io) and surfaced to Terraform as
    # `TF_VAR_CONSOLE_CUSTOM_DOMAIN` by the generic `.parameters` →
    # `TF_VAR_<key>` loop in the cloudflare-domain-validate job template.
    # Declaring a default here would shadow the parameterDefault override
    # and cause the rendered TF_VAR to resolve to the local default ('')
    # in every environment — exactly the silent-empty failure that
    # broke Task 0083 (0 added, 0 changed, 0 destroyed). The Terraform
    # variable itself already defaults to "" in
    # `terraform/variables.tf`, so absence here is safe for dev.

  # The Cloudflare Terraform provider authenticates via the CLOUDFLARE_API_TOKEN
  # env var, resolved by orun from the brokered secret (fresh per run), exactly
  # as cloudflare-kv and cloudflare-hyperdrive do. Declared at component level
  # because plan-only lanes look the zone up against the live API too.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://ws_65T3WPCP/freeploy/{{ .environment }}/CLOUDFLARE_API_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://ws_65T3WPCP/freeploy/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://ws_65T3WPCP/freeploy/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"

  # The attach needs both Workers to exist in the environment first.
  dependsOn:
    - component: deploy-web
    - component: api-edge

  # Unparked (DP-120): freeploy.io is delegated to Cloudflare (curt/jule
  # .ns.cloudflare.com) and the zone is in the account, so the zone lookup
  # resolves. Pull requests plan; a merge to main applies.
  subscribe:
    environments:
      - name: stage
        dependencyRules: # PRs don't wait on other lanes (intent.yaml, environments)
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        dependencyRules: # PRs don't wait on other lanes (intent.yaml, environments)
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
