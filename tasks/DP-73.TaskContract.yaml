apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: DP-73
  title: "DP9: /api/v1 for databases — list, show, create for the eight engines, update, delete, start, restart, stop and the backup schedules"
spec:
  goal: Coolify's /api/v1 answers, on DP-70's pipeline (api-edge's middleware and routes, deploy-core-worker's internal mount), for an org's standalone databases — PostgreSQL, Redis, MongoDB, MySQL, MariaDB, KeyDB, Dragonfly and ClickHouse — and their backup schedules, on the services and stores the console uses — createDatabase() (with the API's fields as create_standalone_*()'s $otherData), showDatabase()'s connection URLs, deleteDatabaseNow()'s never-started rule, the console's database store and the backup schedule stores and checks — with Coolify's controllers' validation, messages, status codes, key order and read:sensitive hiding, every body in Coolify's own JSON bytes. 21 more of openapi.json's 330 operations are ported (57 in all) — databases list, show, create (eight engines), update, delete, start, restart and stop (start and restart answer 501 "… needs the SSH executor, which is not available yet." in Coolify's envelope after Coolify's own refusals), and the backup schedules' list, create, update, delete, executions list and execution delete — each replayed byte for byte (masked ids, uuids — also a new database's uuid in a connection URL — dates and the default destination's name) against goldens emitted by Coolify's real PHP, and each write's rows compared with the rows Coolify's left; the other 273 answer Coolify's 404 shape. Not ported in the databases group — POST /databases/sqlite (Freeploy has no SQLite), the logs, imports, environment variables, storages, storage backup schedules, tags, move, migrate, clone and vulnerabilities routes. Cut, from the end of the task's order — services, deployments, resources, a project's environment details, servers create, update, delete, resources and domains, PATCH /team, S3 storages, cloud tokens and scheduled tasks.
  affects:
    - apps/api-edge/**
    - apps/deploy-core-worker/**
    - packages/db/**
    - tests/api-edge/**
    - tests/deploy-core-worker/**
    - specs/epics/freeploy-coolify-parity/**
    - tasks/**
  doneWhen:
    - every case of tests/deploy-core-worker/fixtures/api/cases.json (295 cases, 142 of them DP-73's) replays against Freeploy byte-equal to goldens.json after the documented masking, except the listed departures (start, restart, an instant deploy, a proxy start and a backup that runs now answer 501; another team's S3 storage is not told apart from an unknown one), DP-70's not-ported operations, which answer Coolify's 404, and the middleware answers, which tests/api-edge replays
    - the rows each DP-73 write leaves in Freeploy's database (PGlite with the deploy schema at head) equal the golden's `after` rows, except the listed departures, which store nothing
    - deploy-core-worker's COOLIFY_COLUMNS equals the column order emit.php reads from Coolify's schema, backup schedules and executions included
    - specs/epics/freeploy-coolify-parity/parity/openapi.operations.json marks the 21 operations ported with taskKey DP-73 (57 ported of 330 in all), and node tools/parity/inventory.ts --check passes
    - on stage, GET https://<edge>/api/v1/databases with a read token answers the org's databases with their backup schedules as Coolify does, and POST /api/v1/databases/postgresql with a write token creates the database and its data volume, starting nothing
  gates: []
