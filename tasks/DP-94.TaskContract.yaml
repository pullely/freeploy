apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: DP-94
  title: "DP11: the deploy canvas at /canvas, ported to React, its plan run in deploy-core-worker through Freeploy's /api/v1 create endpoints, the deploy step answering the SSH executor's 501"
spec:
  goal: Coolify's deploy canvas (canvas/deploy/* — DeployCanvas, Dropdown, Edges, Field, Icon, Node, PaletteItem, RunPanel — with deploy-canvas.js, state.svelte.js and styles.js) is ported to React in apps/deploy-web at Coolify's route /canvas (deploy-canvas, ?project=…&environment=… from the New Resource page and the environment canvas), keeping its markup, cv-* classes, copy and states — the palette (click to append, drag to drop), the step cards with their fields, segmented controls and searchable dropdowns with the "New project" and "New environment" rows, the edges (click to remove), the "Add the next step" menu, the result pill, the Reset confirmation and the run panel with its steps and per-resource tabs. Coolify has no plan controller — its browser calls /api/v1 at /canvas/api with the session (UseSessionTeamApiToken) — so deploy-core-worker gains the deploy canvas endpoints (GET …/deploy/canvas, GET …/deploy/canvas/options/{projects[/{uuid}/environments],servers[/{uuid}/destinations],security/keys}, POST …/deploy/canvas/projects[/{uuid}/environments], POST …/deploy/canvas/run), each asking deploy.resource.write first (a denial 404) and answering through its own /api/v1 handler in-process for the actor with the abilities read, write and deploy (no read:sensitive), inside withOrg. The run ports validate() (Coolify's messages, the steps to mark) and runFlow() (Start, each Server, each line's source then its settings, the first failure stopping the run, then the Deploy step) over the same /api/v1 calls and bodies Coolify's steps send — /applications/{public,private-deploy-key,dockerimage,dockerfile}, /services, /databases/{engine}, PATCH /applications/{uuid}, PATCH /{applications,services}/{uuid}/envs/bulk — and deploys through POST /deploy, which answers Freeploy's 501, so the Deploy step and each resource's tab show it as failed. Cut — the Git step's GitHub app access (no private-github-app create or GitHub App repositories and branches in Freeploy's /api/v1) and following a deployment's logs (none starts). No migration, no binding, no dependency, no api-edge change.
  affects:
    - apps/deploy-web/**
    - apps/deploy-core-worker/**
    - tests/deploy-core-worker/**
    - specs/epics/freeploy-coolify-parity/**
    - tasks/**
  doneWhen:
    - tests/deploy-core-worker/src/deploy-canvas.test.ts holds the run's order (Start, Server, each line's source and settings, Deploy) over the API goldens' fixture, the resources it creates and their fields, the Deploy step failing with the SSH executor's 501 messages and nothing queued, a failed step stopping the run with the API's message and the later steps Waiting, validate()'s problems and the steps to mark, the body's rules, the page's data and the option lists, New project and New environment, every route a 404 that runs nothing without deploy.resource.write, another org's project not found, and the routing
    - apps/deploy-web/test/deploy-canvas.test.ts holds Coolify's deploy-canvas.test.js expectations (planOf, withDeploy, canFollow, loops, uniqueLabels, withoutSecrets, targetFrom, withTarget, fresh, onlyOption, freeSpot, logoOf, the engines) and validate(), the plan sent, a restored flow and the option lists; routes.test.ts maps /canvas to deploy-canvas
    - specs/epics/freeploy-coolify-parity/parity/svelte.json marks the eight canvas/deploy rows ported with taskKey DP-94
    - on stage, an admin opens /canvas from an environment's New Resource page, lays out Start → Server → Docker image → Environment variables, presses "Save only" and finds the application and its variables in the environment; Deploy shows "Deploying the application needs the SSH executor, which is not available yet." on the Deploy step and the resource's tab; a builder gets the lists' "Not found" and cannot run
  gates: []
