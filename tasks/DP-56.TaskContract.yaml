apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: DP-56
  title: "DP5: the deployment queue and the Docker image deployment"
spec:
  goal: Coolify's deployment queue and its deployment of a Docker image application exist as code that is verified but cannot deploy anything yet. The queue (queue_application_deployment, next_queuable, the concurrent-build limits, force start, cancel, fail_unattended_deployment) works on deploy.application_deployment_queues; the compose file and the .env file of a deployment are generated by TypeScript ports that are byte-equal to what Coolify's own PHP writes; and the deployment itself is an engine of resumable steps that issues the commands Coolify's ApplicationDeploymentJob issues, in its order, with its log entries and status changes. The engine is verified only against a fake executor that replays the runs Coolify's own PHP made (tests/deploy-core-worker/fixtures/deployments) — no real server has been deployed to. Nothing can be deployed until the SSH executor is bound to deploy-core-worker (WAITING.md W3) and the Workflow that runs the engine is exported and bound; neither binding is added here, and no wrangler or component file changes. Until then Deploy and Restart keep answering "not available yet" and store nothing, while an application's deployment history and a deployment's log page are served and render their empty states. Builds (Nixpacks, Dockerfile, Docker Compose, static), build servers and additional servers, preview deployments, Swarm, non-root servers, Stop, the deployments started by a rollback, by a server's redeploy and by the scheduler, webhooks and the API are not part of this task.
  affects:
    - apps/deploy-core-worker/**
    - apps/deploy-web/**
    - packages/db/**
    - tests/deploy-core-worker/**
    - tests/db/**
    - specs/epics/freeploy-coolify-parity/**
    - tasks/**
  doneWhen:
    - tests/deploy-core-worker's deployments-compose.test.ts passes — at least 40 different compose files and 40 different .env files that Coolify's PHP wrote (fixtures/deployments/goldens.json) come out of generateComposeFile and generateRuntimeEnvironmentVariables byte for byte
    - tests/deploy-core-worker's deployments-engine.test.ts passes — for every replayed run the engine starts the processes Coolify's job started (script and standard input), in the same order, and ends with the same log entries, deployment status, application status, sleeps, notifications, queued jobs and exception; a deployment run one step at a time, with only the saved state kept between the steps, ends the same
    - tests/db's deploy-deployments.test.ts passes — a deployment is queued, skipped as a duplicate, held back by the server's concurrent-build limit and by a running deployment of the same application, started in Coolify's order and failed as unattended, each within its org only
    - tests/deploy-core-worker's deployments-api.test.ts passes — without the SSH executor POST …/applications/{uuid}/deploy answers 501 and no deployment row exists afterwards; with a fake executor binding it answers 201 with the deployment's uuid and page, a second deploy of the same commit is skipped with Coolify's message, and cancel and force start act on the queue
    - on stage a signed-in org owner opens /project/{uuid}/environment/{env_uuid}/application/{app_uuid}/deployment for a Docker image application and sees "Deployment history" with "No deployments found" and "Deploy the application to create its first deployment record."; pressing Deploy shows the "not available yet" toast and the history stays empty
    - on stage GET …/applications/{uuid}/deployments answers 200 with an empty list for the owner and 404 for a signed-in user without deploy.resource.read
  gates: []
