apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: DP-88
  title: "DP9: /api/v1 for resource logs, rollback, executing scheduled tasks, storage backup schedules, server settings, registries and transfer, database imports and GitHub Apps"
spec:
  goal: Coolify's /api/v1 answers, on DP-70's pipeline (api-edge's middleware and routes, deploy-core-worker's internal mount), for a standalone database's and a service's container logs, an application's rollback images and rollback, executing an application's or a service's scheduled task now, the backup schedule of an application's, a database's and a service's storage (PUT, DELETE and run of …/storages/{storage_uuid}/backups), a server's proxy settings (show, update, restart), Sentinel settings, log drains, image scanning, Cloudflare Tunnel setting (show, update, enable, disable), SSH host key reset, Docker registry logins (list, login, check, logout), transfer status, migrate and the import check, a standalone database's and a service database's imports (upload, import, status) and the org's GitHub Apps (list, create, update, delete) — Coolify's checks in the controllers' order with Laravel's and the rule objects' messages (SafeExternalUrl, ValidHostname, ValidFluentBitConfig, ValidServerIp), every body in Coolify's own JSON bytes, and the rows each write leaves (a schedule and its S3 storages, the server's proxy and ip, the server settings with the host key the updated hooks forget, a GitHub App with its secrets encrypted). 46 more of openapi.json's 330 operations are ported (248 in all), each replayed byte for byte (masked ids, uuids, dates, the team) against goldens emitted by Coolify's real PHP, and each write's rows compared with the rows Coolify's left; the other 82 answer Coolify's 404 shape. Where Coolify runs or queues work on the server — listing containers and reading their logs, listing the server's images, queueing a rollback deployment, ScheduledTaskJob, VolumeBackupJob, StartProxy, setupDefaultRedirect, RestartProxyJob, StartSentinel, StartLogDrain/StopLogDrain, PrepareImageScannerJob, ServerConnectionCheckJob, docker login/logout and reading the Docker config, the transfer's SSH and target checks, the import check's SSH port probe, copying a backup to the server — Freeploy answers 501 in Coolify's envelope ("… needs the SSH executor, which is not available yet.") after Coolify's own checks and before anything is stored. Cut — PUT /servers/{uuid}/proxy/configuration (SaveProxyConfiguration validates the Compose file with ProxyPortParser and the container names before the SSH step; not ported) and POST /servers/{uuid}/transfer/complete (markTransferred() parks the server's managed DNS records and releases its GitHub runners; managed DNS is out of scope).
  affects:
    - apps/api-edge/**
    - apps/deploy-core-worker/**
    - packages/db/**
    - tests/api-edge/**
    - tests/deploy-core-worker/**
    - specs/epics/freeploy-coolify-parity/**
    - tasks/**
  doneWhen:
    - every case of tests/deploy-core-worker/fixtures/api/cases.json (1766 cases, 316 of them DP-88's) replays against Freeploy byte-equal to goldens.json after the documented masking, except the listed departures (the 38 that answer 501) and the middleware answers, which tests/api-edge replays
    - the rows each DP-88 write leaves in Freeploy's database (PGlite with the deploy schema at head) equal the golden's `after` rows — the backup schedules and their S3 storages, the server's proxy and addresses, the server settings, the GitHub Apps — except the departures, which store nothing
    - the earlier cases' goldens change only in random values (uuids, ciphertexts, generated passwords and names)
    - specs/epics/freeploy-coolify-parity/parity/openapi.operations.json marks the 46 operations ported with taskKey DP-88 (248 ported of 330 in all), and node tools/parity/inventory.ts --check passes
    - on stage, PUT https://<edge>/api/v1/applications/{uuid}/storages/{storage_uuid}/backups with a write token creates a backup schedule that a second PUT updates, and GET /api/v1/servers/{uuid}/proxy answers the server's proxy settings
  gates: []
