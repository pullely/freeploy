apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: DP-62
  title: "DP7: starting, stopping and restarting standalone databases"
spec:
  goal: Coolify's start, restart and stop of a standalone database and the TCP proxy of a public one exist, for all eight engines (PostgreSQL, Redis, MySQL, MariaDB, MongoDB, KeyDB, Dragonfly, ClickHouse), as code that is verified but has started nothing yet. From plain row data a pure plan builder gives the docker-compose file and the ordered command list each engine's Start action sends to the server, and another the nginx configuration, compose file and commands of the proxy; both are byte-equal to what Coolify's own PHP writes. An engine of steps runs a plan through the executor interface with Coolify's processes in Coolify's order — the content files it checks and writes first, the one command batch, the container's status afterwards — and its row updates, and it marks the database as started before the first command reaches the server. With SSL it creates the server's CA when there is none and the database's certificate with its file mounts, through DP-48's generator. The engine is verified only against a fake executor that replays the runs Coolify's own PHP made (tests/deploy-core-worker/fixtures/database-start) — no database has been started on a real server. Nothing can be started until the SSH executor is bound to deploy-core-worker (WAITING.md W3); that binding is not added here, and no wrangler, component or migration file changes. Until then Start, Restart, Stop and a running database's Access listbox keep answering "needs the SSH executor, which is not available yet" and store nothing; only "Regenerate SSL Certificates" changes for a user today — it now stores a new certificate where it answered 501 — and it can only apply to a database that has started with SSL, which none has. A queue or Workflow for the start, the stored start log, the guard against two starts at once, non-root servers, Swarm, image scans, a secret manager, counting crash restarts, the deletion of a started database and the pages' side of a running start are not part of this task.
  affects:
    - apps/deploy-core-worker/**
    - packages/db/**
    - tests/deploy-core-worker/**
    - tests/db/**
    - specs/epics/freeploy-coolify-parity/**
    - tasks/**
  doneWhen:
    - tests/deploy-core-worker's database-start.test.ts passes — every one of the 644 runs Coolify's PHP made (fixtures/database-start/goldens.json; at least twelve starts for each of the eight engines) is replayed, and the engine starts the processes Coolify started, in the same order with the same text, which holds each start's command list and its docker-compose file byte for byte; it ends with the same answer, start log, database status, last_online_at, restart counters (restart_count, last_restart_at, last_restart_type — reset by a start, a restart and a stop with its cleanup checkbox, kept by a refused start and a stop without it), certificate rows, file mounts, variables, sleeps, queued jobs, events and notifications; a generated certificate is masked the same way on both sides and held to Coolify's subject, issuer, validity, curve and signature
    - the same file shows a start run one step at a time with only the saved state kept between the steps ending the same, started_at set before the first process of a start and kept at a later one, a failed pull and a failing command ending the start as failed with Coolify's words while the database stays marked, and a start on an unreachable server storing nothing
    - tests/deploy-core-worker's database-operations-api.test.ts passes — without the SSH executor's binding POST …/deploy/databases/{uuid}/start, /restart and /stop answer 501 "… needs the SSH executor, which is not available yet." and no row changes, and a running database's Access listbox answers 501 and stores nothing; with a fake binding the three routes run the engine and answer with the start's log and the database's status, a public database's proxy is started after its start, and the Access listbox starts and removes the proxy; a stop resets the restart counters unless its body has dockerCleanup false
    - the same file shows POST …/databases/{uuid}/ssl/regenerate storing a new certificate, key and file mounts for a database that has a certificate, and answering Coolify's "No existing SSL certificate found for this database." for one that has none
    - tests/db's deploy-database-operations.test.ts passes — for each of the eight engines the row a start reads comes with its environment, project, network and server; started_at is set once and kept; the health check settings and restart counters of migration 660 are read, and the counters are reset (and not written when already reset); a changed status sets last_online_at and an unchanged one does not; a database's certificate is found and deleted without touching the server's CA, and the certificate's file mounts are created with their modes and deleted by their mount paths; and another org reads and changes none of it
    - on stage POST /v1/organizations/{org}/deploy/databases/{uuid}/start still answers 501 "Starting the database needs the SSH executor, which is not available yet." for the org owner, and the database's row is unchanged
  gates: []
