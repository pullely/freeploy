apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: DP-98
  title: "DP11: the projects, project, servers, server, dashboard, shared variable and tag canvases — the environment canvas's server and connect views, fed by /canvas/api endpoints, with zone places, tags and shared variables saved on their rows"
spec:
  goal: Coolify's remaining canvases — /projects/canvas (project.canvas.index), /project/{uuid}/canvas (project.canvas), /servers/canvas (server.canvas.index), /server/{uuid}/canvas (server.canvas), /dashboard/canvas (dashboard.canvas), the shared variable canvases (/shared-variables/team/canvas, …/project/{uuid}/canvas, …/environments/project/{p}/environment/{e}/canvas, …/server/{uuid}/canvas) and /canvas/tags (tags.canvas) — are ported to deploy-web over DP-91/DP-92's React canvas, which gains EnvironmentCanvas.svelte's server view (project / environment group frames, group and card drags saved on the cards' environment canvas, zone drags saved as the project's or server's place, the server's containers and usage loaded after it renders, data-poll, the dashboard's Deployments panel, EmptyCard placeholders) and connect view (layoutConnectView, groupByUse, the project / environment filters through Select, Panel's source, resource and source → resource panels with AddSection, ?select=), with Coolify's markup, copy and states. deploy-core-worker answers Coolify's /canvas/api paths under /v1/organizations/{org}/deploy/canvas/api in the payload()s' shapes (ProjectCanvas::teamPayload and payload, ServerCanvas::payload and dashboardPayload, SharedVariableCanvas::payload for each scope, TagCanvas::payload), built on existing rows; ports ProjectCanvasController's and ServerCanvasController's updatePositions (projects.canvas_position, servers.canvas_position), TagCanvasController's storeLink and destroyLink (taggables) and SharedVariableCanvasController's storeLink and destroyLink (a resource variable holding {{scope.KEY}}, its preview copy, the longer-value and Docker Compose refusals) with their rules and messages; answers the SSH executor's 501 for a functional server's unmanaged containers and its Sentinel usage. Reads ask deploy.resource.read, can_edit and every write deploy.resource.write, a denial is 404, everything runs inside withOrg. packages/db gains deploy/canvas-views.ts (the org's environments, projects and servers for the canvases, the two zone-place saves, every link, the tags' pivot, some resources' saved variables, the dashboard's deployments) and the org-wide applications, services and databases lists. No migration, no binding, no dependency, no api-edge change.
  affects:
    - apps/deploy-web/**
    - apps/deploy-core-worker/**
    - packages/db/**
    - tests/deploy-core-worker/**
    - tests/db/**
    - specs/epics/freeploy-coolify-parity/**
    - tasks/**
  doneWhen:
    - tests/deploy-core-worker/src/canvas-views.test.ts holds each payload's shape (projects, project, servers, server, dashboard with its deployments, the four shared variable scopes, tags), the zone-place saves' rules, the tag and shared variable links' rules and messages (already linked, not removable, the Compose file's use, Link not found.), the containers' and usage's 501, that reads ask deploy.resource.read and writes deploy.resource.write with a denial 404 that runs nothing, another org seeing none of the rows, and the routing
    - tests/db/src/deploy-canvas-views.test.ts holds the environments with their saved positions, the projects' and servers' zone places saved and read back, the org-wide applications, services and databases, the links, the pivot in attach order, the saved variables with and without preview copies, the dashboard's active and recent deployments, and row-level security on all of it
    - apps/deploy-web/test/canvas-views.test.ts holds the server view's layout (chains, saved arrangements, zones' saved places, the groups' order and frames, an empty environment's place), the connect view's layout, the filters, canConnect's server and connect rules, the group drag rules, the connect wording and the deployment rows; routes.test.ts maps the ten routes
    - specs/epics/freeploy-coolify-parity/parity/svelte.json marks EnvironmentCanvas, Panel, Toolbar, AddSection, Select, EmptyCard and Deployments ported, with taskKey DP-98
    - on stage, an admin moves a project zone on /projects/canvas and a server zone on /servers/canvas and finds them there after a reload, drags a group on /servers/canvas and finds it moved on its environment canvas, tags a resource on /canvas/tags and adds a team variable to a resource on /shared-variables/team/canvas, then removes both; a builder sees "View only"
  gates: []
