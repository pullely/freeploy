  affects:
    - apps/identity-worker/**
    - apps/deploy-web/**
    - tests/identity-worker/**
    - tools/parity/**
    - specs/epics/freeploy-coolify-parity/**
    - tasks/**
  doneWhen:
    - a new account registers and signs in through api-edge on stage
    - /login and /register on deploy-web stage pass the visual and DOM gate against the reference with email configured
  gates: []
