apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: DP-61
  title: "DP5: deployments for the Dockerfile, Nixpacks, static and simple-Dockerfile build packs"
spec:
  goal: The deployment engine of DP-56 also deploys the build packs that build on the application's server — a Dockerfile in a public Git repository, the pasted Dockerfile of a "simple Dockerfile" application, Nixpacks and a static site — as code that is verified but cannot deploy anything yet. It issues what Coolify's ApplicationDeploymentJob issues for deploy_dockerfile_buildpack, deploy_simple_dockerfile, deploy_nixpacks_buildpack, deploy_static_buildpack and just_restart, in its order and with its log — reading the branch's head, cloning a public repository (the public GitHub source, or any host's repository by its URL), saving the SSH host keys git accepted, looking for the image of the commit and skipping or repeating the build, the build-time .env file, the build arguments or BuildKit secrets with their hash, the ARG lines and secret mounts in the Dockerfile, the Nixpacks plan, the generated nginx Dockerfile and configuration of a static site, the docker build command in every variant, the push to the application's registry, then the runtime .env file, health check and rolling update it shares with a Docker image. It is verified only against a fake executor that replays the runs Coolify's own PHP made (tests/deploy-core-worker/fixtures/deployments) — nothing has been built or deployed on a real server. Nothing can be deployed until the SSH executor is bound to deploy-core-worker (WAITING.md W3) and the Workflow that runs the engine is exported and bound; neither binding is added here, and no wrangler or component file changes, so Deploy and Restart keep answering "not available yet" and store nothing in every environment. With the executor bound, POST …/applications/{uuid}/deploy and …/restart queue these build packs instead of answering 501; Docker Compose, Railpack, a build server (also a server for deployments only), "Preserve Repository", and private Git sources (deploy keys, Git Apps, HTTPS credentials — DP6) stay refused with their reason, before anything is queued. Not part of this task — Railpack (the pinned Coolify has it; it was cut), Coolify's configuration snapshot (so Freeploy's own deployments rebuild an image that exists, as Coolify does after a deployment without a snapshot), previews, additional servers, Swarm, non-root servers, the image scan gate, and file storages with content.
  affects:
    - apps/deploy-core-worker/**
    - packages/db/**
    - tests/deploy-core-worker/**
    - tests/db/**
    - specs/epics/freeploy-coolify-parity/**
    - tasks/**
  doneWhen:
    - tests/deploy-core-worker's deployments-engine.test.ts passes — at least 25 golden runs of each of the four build packs (dockerfile.*, simple.*, nixpacks.*, static.* in fixtures/deployments/goldens.json, made by Coolify's own PHP) are replayed, and for every one the engine starts the processes Coolify's job started (script and standard input), in the same order, and ends with the same log entries, deployment status, application status, commit, commit message, health check columns, saved SSH host keys, created variables, sleeps, notifications, queued jobs and exception
    - the same test replays every one of those builds a second time one step at a time, with only the engine's state kept as JSON between the steps, and it ends the same
    - tests/db's deploy-deployment-builds.test.ts passes — the Git and build columns of an application are read, the commit and commit message of a deployment, the health check columns and the SSH host keys of an application are written, each within its org only
    - tests/deploy-core-worker's deployments-api.test.ts passes — without the SSH executor POST …/applications/{uuid}/deploy answers 501 and no deployment row exists afterwards; with a fake executor binding a dockerfile, a nixpacks and a static application of a public repository are queued (201) with the commit they are pinned to, and a Docker Compose application, a Railpack application, a build server, a deployments-only server, a preserved repository, a deploy key, a Git App source and HTTPS credentials are each refused with 501 and their reason while nothing is queued
    - on stage a signed-in org owner presses Deploy on an application created from a public Git repository and sees the "not available yet" toast, and its deployment history stays "No deployments found"
  gates: []
