apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: DP-65
  title: "DP7: S3 storages and database backup schedules"
spec:
  goal: Coolify's Integrations → Storage for S3-compatible storages and a standalone database's backup schedules, configured but never run. A storage is listed, created, shown, updated and deleted under /v1/organizations/{org}/deploy/storages; its key and secret are stored encrypted with the org's key and the secret is never returned; it is created and updated only after the connection test works, and "Validate connection" tests the form's values and stores only whether the storage is usable. The connection test is Coolify's — the endpoint checked as SafeWebhookUrl checks it, the bucket name as ValidS3BucketName does, then one ListObjectsV2 (prefix "", delimiter "/") signed with AWS Signature Version 4 (on Web Crypto, no dependency) for the storage's region, path-style or virtual-hosted as Coolify's disk addresses it, with Coolify's fallback to virtual-hosted style when a provider rejects path-style URLs — through an injectable fetch and host resolver, with the messages Coolify shows word for word. Deleting a storage lets every schedule that uses it go first, as S3Storage::detachFromBackups() does (other destinations kept, S3 off when none remains, its S3 copies marked deleted); the Resources tab moves a schedule to another storage or takes this one out of it. A database's schedules are listed, created (frequency with Coolify's cron validation and presets, the database the container creates as databases_to_backup), shown, saved (databases to back up, dump all where the engine has it, S3 on or off with one or more storages, local and S3 retention, timeout, missing backup alert, keep or delete the local copy), enabled and disabled, and deleted under …/deploy/databases/{uuid}/backups; executions are read and are empty because nothing runs a schedule. Pages /storages (New storage in a dialog), /storages/{uuid} with General, Resources and Danger Zone, and a database's Backups page with the schedule's dialog are hand-ported. Not part of this task — the scheduler, DatabaseBackupJob, "Back up now" (501, the SSH executor), deleting backup files on a server or on S3 (501 while files exist; none can yet), restore and import, SFTP, FTPS and WebDAV storages (501 "not available yet"), volume backup schedules (only detached from a deleted storage), the failure email of an unusable storage, and service databases' backups.
  affects:
    - apps/deploy-core-worker/**
    - apps/deploy-web/**
    - packages/db/**
    - tests/deploy-core-worker/**
    - tests/db/**
    - specs/epics/freeploy-coolify-parity/**
    - tasks/**
    - THIRD_PARTY_NOTICES.md
  doneWhen:
    - tests/deploy-core-worker's s3-storages.test.ts passes — the signer reproduces the canonical request, string to sign and Authorization header of 21 cases of AWS's Signature Version 4 test suite (fixtures/s3/aws4-testsuite.json) and the Authorization header aws-sdk-php computed for every ListObjectsV2 of Coolify's connection test in fixtures/s3/goldens.json (made by Coolify's own PHP against a fake endpoint), the request's host, path and query match the SDK's for path-style, virtual-hosted, dotted and upper-case buckets and endpoints with a path, every failure answer gives the message Coolify raised, the path-style fallback and S3Storage::testConnection()'s cases end as Coolify's did, and the New Storage and General forms answer Laravel's messages for every validation golden
    - tests/deploy-core-worker's database-backups.test.ts passes — BackupEdit's rules, validateDatabasesBackupInput() and validate_cron_expression() answer as Coolify's PHP does for every golden, and the API creates, saves, toggles and deletes schedules with Coolify's checks and messages, answers 501 for Back up now on a running database, and 404 on a denied or unknown resource
    - tests/db's deploy-s3-storages.test.ts passes — storages are stored with the org's ciphertexts and listed by name, a schedule's destinations sync with the pivot and the legacy s3_storage_id, deleting a storage detaches it from database and volume schedules and marks its S3 copies deleted, deleting a schedule removes its executions, replicas and destinations, deleting a database removes its schedules, each within its org only
    - apps/deploy-web's routes test maps /storages, /storages/{uuid}[/resources|/danger] and a database's /backups to their pages and redirects …/backups/{backup_uuid}[/{section}] to /backups?schedule={backup_uuid}
    - on stage a signed-in org owner adds an S3 storage with working credentials, sees it Connected, adds a backup schedule to a PostgreSQL database that sends to it, and deleting the storage turns that schedule's S3 off
  gates: []
